name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tuist-generate:
    name: Tuist manifest check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tuist
        run: brew install --quiet tuist
      - name: Stub the Rust-generated bindings
        # rust-core/generated/ is gitignored — it's normally produced by
        # scripts/build-rust.sh as an Xcode pre-build step, which doesn't run
        # for `tuist generate` on its own. This job only checks the Tuist
        # manifest itself (the Bazel job below does the real Rust build), so
        # a placeholder is enough to satisfy Tuist's source-glob and library
        # dependency validation at generate time.
        run: |
          mkdir -p rust-core/generated/swift
          touch rust-core/generated/swift/module.modulemap
      - name: Generate Xcode project
        run: tuist generate --no-open

  bazel-build:
    name: Bazel build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: bazel build //Swift/RelayApp:Relay
        run: bazel build //Swift/RelayApp:Relay

      - name: Smoke-check the app bundle
        run: |
          rm -rf /tmp/Relay-check
          mkdir -p /tmp/Relay-check
          unzip -q bazel-bin/Swift/RelayApp/Relay.zip -d /tmp/Relay-check
          codesign -dv /tmp/Relay-check/Relay.app
